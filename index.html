<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serene · Spa Booking Prototype</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#293c35;background:#f8f7f3;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}#app{display:flex;min-height:100vh}.sidebar{width:238px;background:#fff;border-right:1px solid #e9ebe6;padding:26px 15px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}.logo{display:flex;gap:11px;align-items:center;padding:0 10px;font-family:Georgia,serif;font-size:24px;color:#3b6255}.symbol{width:33px;height:33px;background:#507e70;color:white;border-radius:11px;display:grid;place-items:center;font-size:23px}.sublabel{font:10px Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#9aaca0}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:11px;padding:13px;text-align:left;background:transparent;color:#718078;width:100%;display:flex;align-items:center;gap:12px}.nav button.active{background:#eaf1eb;color:#3c705f;font-weight:700}.nav button:hover{background:#f1f5f0}.nav .ico{font-size:19px;width:22px;text-align:center}.main{flex:1;min-width:0;max-width:1700px;padding:33px 42px 65px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:11px;color:#8c9b91;text-transform:uppercase;letter-spacing:1.8px;font-weight:700}h1{font-size:29px;letter-spacing:-.7px;font-family:Georgia,serif;margin:7px 0 6px;font-weight:500}h2{font-size:18px;margin:0 0 16px;font-weight:650}h3{margin:0 0 8px}p{color:#819088;margin:0}button.primary{background:#527e70;border:1px solid #527e70;color:white;border-radius:10px;padding:11px 17px;font-weight:650}button.secondary,button.light{background:white;border:1px solid #dbe3dd;border-radius:10px;padding:10px 15px;color:#52685c}button.light{background:#edf3ee;border:0}button.danger{color:#b7504b;border:1px solid #edc5c0;background:#fff}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:18px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{border:1px solid #e7eae4;background:#fff;border-radius:17px;padding:23px;box-shadow:0 3px 20px #27352c08}.stat b{font-size:29px;font-weight:600;display:block;margin:13px 0 6px}.stat small{color:#849287}.muted{color:#88958c}.section{margin-top:24px}.stack{display:grid;gap:11px}.item{display:flex;align-items:center;gap:13px;padding:14px;border-radius:12px;border:1px solid #e9eee8;background:white}.item:hover{border-color:#9ab5a5}.grow{flex:1;min-width:0}.item strong{display:block;margin-bottom:5px}.item small{color:#819087}.badge{font-size:11px;padding:6px 9px;border-radius:99px;background:#eef3ed;color:#497365;white-space:nowrap;font-weight:650}.badge.warn{background:#fcf1dc;color:#a4782c}.badge.blue{background:#edf1fc;color:#5778b7}.badge.red{background:#f9eae7;color:#b95855}.badge.gray{background:#f0f0ee;color:#7b837d}.time{color:#527e70;font-weight:700;font-variant-numeric:tabular-nums}.line{border-top:1px solid #edf0eb;margin:15px 0}.link{border:0;background:none;color:#507f70;font-weight:650;padding:7px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-size:12px;color:#617367;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4dc;border-radius:10px;background:white;padding:12px;color:#2e4439;outline:none}.field input:focus,.field select:focus{border-color:#527e70;box-shadow:0 0 0 3px #527e7020}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.modalshade{position:fixed;inset:0;background:#1c302979;display:flex;justify-content:flex-end;z-index:10}.drawer{width:min(570px,100vw);background:#fdfdfa;min-height:100vh;overflow:auto;box-shadow:-15px 0 45px #152c2230;padding:29px}.drawer header{display:flex;justify-content:space-between;align-items:start;margin-bottom:25px}.drawer h2{font:26px Georgia,serif;margin:8px 0}.steps{display:flex;gap:7px;margin-bottom:22px}.steps span{height:5px;border-radius:5px;background:#e4e8e1;flex:1}.steps span.on{background:#527e70}.toast{position:fixed;right:25px;bottom:25px;background:#263f34;color:#fff;padding:15px 22px;border-radius:10px;z-index:20;box-shadow:0 10px 25px #223a3040}.calendar{overflow:auto}.calendargrid{display:grid;grid-template-columns:70px repeat(4,minmax(170px,1fr));min-width:790px}.calhead{padding:12px;background:#f3f6f1;text-align:center;font-weight:650;border-bottom:1px solid #dfe6dc}.calcell{border-bottom:1px solid #edf0ec;border-right:1px solid #edf0ec;min-height:72px;padding:5px;position:relative}.slot{border-radius:8px;background:#eaf3ed;border-left:3px solid #689983;padding:7px;font-size:11px;cursor:pointer;margin:2px 0;line-height:1.5}.slot:hover{background:#d5e9dc}.slot.started{background:#edf0fb;border-color:#8798d4}.slot.checked_in{background:#fff1d9;border-color:#dfa552}.slot.completed{background:#f0f0ef;border-color:#aeb7ad}.slot strong{display:block}.calcompact .calendargrid{grid-template-columns:70px repeat(4,minmax(135px,1fr));min-width:650px}.calcompact .calcell{min-height:50px}.calcompact .slot{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;padding:5px}.chip{background:#f2f5f0;border:1px solid #e6ebe4;border-radius:8px;padding:9px 11px;display:inline-block}.progress{height:7px;background:#e6ece6;border-radius:10px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#739c88}.empty{text-align:center;padding:55px 20px;color:#86958b}.foot{margin-top:auto;border-top:1px solid #e7ebe5;padding:20px 8px;color:#8d9a91;font-size:12px}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pillrow button{border:1px solid #e0e9df;background:#fff;padding:9px 12px;border-radius:10px}.pillrow button.selected{background:#e6f2e9;color:#376b55;border-color:#8eb9a1}.help{background:#eff5ef;border-radius:12px;padding:15px;color:#55705e;line-height:1.6;font-size:12px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;color:#8a9a8e;text-transform:uppercase;padding:12px}.table td{border-top:1px solid #edf0eb;padding:13px 12px}.overlay{background:#f5f7f2;padding:14px;border-radius:12px}.right{text-align:right}.margin{margin-top:16px}.separator{height:1px;background:#e8ece6;margin:18px 0}@media(max-width:1050px){.sidebar{width:74px;padding:20px 10px}.sidebar .navlabel,.sidebar .brandtext,.sidebar .foot{display:none}.nav button{justify-content:center}.main{padding:22px}.four{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:650px){.sidebar{position:fixed;bottom:0;top:auto;width:100%;height:62px;z-index:5;padding:6px}.sidebar .logo,.sidebar .foot{display:none}.nav{display:flex;overflow:auto}.nav button{width:auto;padding:10px}.main{padding:22px 14px 85px}.top{align-items:start;gap:10px}.four,.three,.columns{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.card{padding:16px}h1{font-size:25px}}
</style></head><body><div id="app"></div><script>
const today='2026-10-28';
const initial={
customers:[{id:'c1',name:'Nguyễn Minh Anh',phone:'090 123 4567',visits:8,notes:'Ưu tiên KTV Lan; da nhạy cảm'},{id:'c2',name:'Trần Ngọc Hà',phone:'091 222 3344',visits:4,notes:'Thích khung giờ sáng'},{id:'c3',name:'Lê Thu Trang',phone:'093 555 9900',visits:2,notes:''},{id:'c4',name:'Phạm Thảo Vy',phone:'098 104 2121',visits:11,notes:'Ưu tiên phòng yên tĩnh'},{id:'c5',name:'Đỗ Bảo Ngọc',phone:'090 888 5000',visits:1,notes:''}],
staff:[{id:'s1',name:'Lan',role:'Chăm sóc da'},{id:'s2',name:'Hương',role:'Massage'},{id:'s3',name:'Mai',role:'Chăm sóc da'},{id:'s4',name:'Thảo',role:'Đa dịch vụ'}],
services:[{id:'v1',name:'Chăm sóc da chuyên sâu',mins:60,price:850000},{id:'v2',name:'Massage thư giãn',mins:60,price:650000},{id:'v3',name:'Phục hồi da chuyên biệt',mins:90,price:1100000},{id:'v4',name:'Gội đầu dưỡng sinh',mins:45,price:390000}],
packages:[{id:'p1',customerId:'c1',serviceId:'v1',total:10,remaining:8,expiry:'2027-06-30'}],
bookings:[{id:'b1',customerId:'c1',serviceId:'v1',staffId:'s1',date:today,time:'09:30',status:'confirmed',room:'P.01',note:'Buổi liệu trình',paid:false},{id:'b2',customerId:'c2',serviceId:'v2',staffId:'s2',date:today,time:'10:00',status:'checked_in',room:'P.02',note:'',paid:false},{id:'b3',customerId:'c3',serviceId:'v3',staffId:'s3',date:today,time:'11:00',status:'confirmed',room:'P.03',note:'',paid:false},{id:'b4',customerId:'c4',serviceId:'v4',staffId:'s4',date:today,time:'09:00',status:'started',room:'P.04',note:'',paid:false},{id:'b5',customerId:'c5',serviceId:'v1',staffId:'s1',date:today,time:'13:00',status:'pending',room:'P.01',note:'',paid:false},{id:'b6',customerId:'c2',serviceId:'v4',staffId:'s2',date:today,time:'15:00',status:'confirmed',room:'P.02',note:'',paid:false}],
payments:[],ledger:[]
};
const saved=(()=>{try{return JSON.parse(localStorage.getItem('serene-prototype-v1'))}catch{return null}})();
let db=saved||structuredClone(initial),view='today',modal=null,step=0,form={},compact=false,filterStaff='all',search='',calDate=today,extraSale=0,toastText='',showCompleted=false;
const el=document.getElementById('app');
const customer=id=>db.customers.find(x=>x.id===id);
const staff=id=>db.staff.find(x=>x.id===id);
const service=id=>db.services.find(x=>x.id===id);
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
const label={pending:'Chờ xác nhận',confirmed:'Đã xác nhận',checked_in:'Đã check-in',started:'Đang phục vụ',completed:'Hoàn tất',cancelled:'Đã hủy',no_show:'Không đến'};
const badge=s=>'<span class="badge '+({pending:'warn',checked_in:'warn',started:'blue',cancelled:'red',no_show:'red',completed:'gray'}[s]||'')+'">'+label[s]+'</span>';
const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>localStorage.setItem('serene-prototype-v1',JSON.stringify(db));
const displayDate=d=>new Date(d+'T12:00').toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const minutes=t=>{let [h,m]=t.split(':').map(Number);return h*60+m};
const conflict=(date,time,staffId,serviceId,ignore)=>db.bookings.some(b=>b.id!==ignore&&b.date===date&&b.staffId===staffId&&!['cancelled','no_show'].includes(b.status)&&minutes(time)<minutes(b.time)+service(b.serviceId).mins&&minutes(b.time)<minutes(time)+service(serviceId).mins);
function notify(t){toastText=t;render();setTimeout(()=>{toastText='';render()},2900)}
function nav(v){view=v;modal=null;render()}
function startBooking(customerId){form={customerId:customerId||db.customers[0].id,serviceId:'v1',staffId:'s1',date:today,time:'14:00',room:'P.01',note:''};step=0;modal='new';render()}
function openBooking(id){modal='booking';form={id};extraSale=0;render()}
function closeModal(){modal=null;render()}
function setForm(k,v){form[k]=v}
function saveBooking(){if(conflict(form.date,form.time,form.staffId,form.serviceId,form.id)){notify('Trùng lịch KTV. Vui lòng chọn giờ hoặc KTV khác.');return}if(form.id){let b=db.bookings.find(x=>x.id===form.id);Object.assign(b,{date:form.date,time:form.time,staffId:form.staffId,room:form.room});notify('Đã cập nhật lịch hẹn')}else{let id='b'+Date.now();db.bookings.push({...form,id,status:'confirmed',paid:false});notify('Đã tạo lịch hẹn thành công')}persist();modal=null;render()}
function changeStatus(id,status){let b=db.bookings.find(x=>x.id===id);if(!b)return;if(['cancelled','no_show'].includes(status)&&b.status==='completed'){notify('Không thể hủy phiên phục vụ đã hoàn tất');return}b.status=status;persist();notify('Đã cập nhật: '+label[status])}
function getPackage(b){return db.packages.find(p=>p.customerId===b.customerId&&p.serviceId===b.serviceId&&p.remaining>0&&p.expiry>=b.date)}
function checkout(id,withPackage,serum){let b=db.bookings.find(x=>x.id===id);if(b.paid){notify('Giao dịch đã thanh toán. Không thể ghi nhận lần hai.');return}let pkg=withPackage?getPackage(b):null;if(withPackage&&!pkg){notify('Không còn quyền lợi hợp lệ');return}if(pkg){pkg.remaining--;db.ledger.push({id:'l'+Date.now(),packageId:pkg.id,bookingId:id,delta:-1,at:new Date().toISOString(),type:'use'})}let amount=(pkg?0:service(b.serviceId).price)+(serum?450000:0);db.payments.push({id:'pay'+Date.now(),bookingId:id,customerId:b.customerId,amount,packageUsed:!!pkg,serum:!!serum,at:new Date().toISOString()});b.paid=true;b.status='completed';persist();modal=null;notify('Hoàn tất checkout · '+money(amount));}
function bookingCard(b,mini=false){return '<div class="item"><div class="time">'+safe(b.time)+'</div><div class="grow"><strong>'+safe(customer(b.customerId)?.name)+'</strong><small>'+safe(service(b.serviceId)?.name)+' · KTV '+safe(staff(b.staffId)?.name)+' · '+b.room+'</small></div>'+badge(b.status)+'<button class="secondary" onclick="openBooking(\''+b.id+'\')">'+(mini?'Mở':'Chi tiết')+'</button></div>'}
function header(title,desc,button=true){return '<div class="top"><div><div class="eyebrow">SERENE SPA · SERVICE OPERATIONS</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(button?'<button class="primary" onclick="startBooking()">＋ Tạo lịch hẹn</button>':'')+'</div>'}
function todayPage(){let bs=db.bookings.filter(b=>b.date===today&&!['cancelled','no_show'].includes(b.status));let todo=bs.filter(b=>['pending','confirmed','checked_in','started'].includes(b.status)).sort((a,b)=>({checked_in:0,started:1,pending:2,confirmed:3}[a.status]-{checked_in:0,started:1,pending:2,confirmed:3}[b.status])||a.time.localeCompare(b.time));return header('Một ngày thật nhẹ nhàng','Thứ Tư, 28 tháng 10 · Tập trung vào việc cần xử lý trước')+'<div class="grid four">'+[['Lịch hẹn hôm nay',bs.length,'calendar'],['Chờ tiếp nhận',bs.filter(b=>b.status==='confirmed').length,'wait'],['Đang phục vụ',bs.filter(b=>b.status==='started').length,'service'],['Cần xử lý',bs.filter(b=>['pending','checked_in'].includes(b.status)).length,'action']].map(([n,v])=>'<div class="card stat"><small>'+n+'</small><b>'+v+'</b><small>Ngày 28/10</small></div>').join('')+'</div><div class="grid two section"><div class="card"><div class="row"><h2>Ưu tiên xử lý</h2><span class="badge">'+todo.length+' lịch</span></div><div class="stack">'+(todo.length?todo.map(b=>bookingCard(b,true)).join(''):'<div class="empty">Không có công việc cần xử lý</div>')+'</div></div><div class="stack"><div class="card"><div class="row"><h2>Điều phối nhanh</h2><button class="link" onclick="nav(\'calendar\')">Mở Calendar →</button></div><p>Giữ Calendar ở màn riêng để tránh quá tải khi đông khách.</p><div class="separator"></div>'+db.staff.map(s=>{let count=bs.filter(b=>b.staffId===s.id).length;return '<div class="row" style="margin:12px 0"><span>● '+s.name+'</span><span class="badge">'+count+' lịch</span></div>'}).join('')+'</div><div class="card"><h2>Thao tác nhanh</h2><div class="stack"><button class="light" onclick="startBooking()">＋ Đặt lịch mới</button><button class="secondary" onclick="nav(\'customers\')">⌕ Tìm khách hàng</button><button class="secondary" onclick="nav(\'transactions\')">▤ Xem giao dịch</button></div></div></div></div>'}
function calendarPage(){let bs=db.bookings.filter(b=>b.date===calDate&&b.status!=='cancelled'&&(filterStaff==='all'||b.staffId===filterStaff));let people=filterStaff==='all'?db.staff:db.staff.filter(s=>s.id===filterStaff);let grid='<div class="calendargrid" style="grid-template-columns:70px repeat('+people.length+',minmax(170px,1fr))"><div class="calhead">Giờ</div>'+people.map(s=>'<div class="calhead">'+s.name+'<small style="display:block;font-weight:400;color:#87978b">'+s.role+'</small></div>').join('');for(let h=8;h<=19;h++){grid+='<div class="calcell"><small class="muted">'+String(h).padStart(2,'0')+':00</small></div>';people.forEach(s=>{let arr=bs.filter(b=>b.staffId===s.id&&Number(b.time.slice(0,2))===h);grid+='<div class="calcell">'+arr.map(b=>'<div class="slot '+b.status+'" onclick="openBooking(\''+b.id+'\')"><strong>'+b.time+' · '+safe(customer(b.customerId)?.name)+'</strong>'+(compact?'':safe(service(b.serviceId)?.name)+' · '+label[b.status])+'</div>').join('')+'</div>'})}grid+='</div>';return header('Lịch hẹn & điều phối','Lọc theo nhân sự và chế độ xem, tránh hiển thị quá nhiều thông tin')+'<div class="card"><div class="toolbar" style="margin-bottom:18px"><input type="date" value="'+calDate+'" onchange="calDate=this.value;render()" style="padding:10px;border:1px solid #dce5dc;border-radius:10px"><select onchange="filterStaff=this.value;render()" style="padding:10px;border:1px solid #dce5dc;border-radius:10px"><option value="all">Tất cả KTV</option>'+db.staff.map(s=>'<option value="'+s.id+'" '+(filterStaff===s.id?'selected':'')+'>'+s.name+'</option>').join('')+'</select><button class="secondary" onclick="compact=!compact;render()">'+(compact?'▤ Chi tiết':'▦ Thu gọn')+'</button><button class="secondary" onclick="view=\'appointments\';render()">≡ Danh sách</button><span class="badge">'+bs.length+' lịch</span></div><div class="calendar '+(compact?'calcompact':'')+'">'+grid+'</div><div class="help margin">Lịch được hiển thị theo giờ bắt đầu; thời lượng dịch vụ và xung đột được kiểm tra khi tạo/đổi lịch. Đây chưa phải timeline kéo thả tỷ lệ thời gian chuẩn.</div></div>'}
function appointmentsPage(){let bs=db.bookings.filter(b=>[customer(b.customerId)?.name,service(b.serviceId)?.name,b.time].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));return header('Tất cả lịch hẹn','Chế độ danh sách phù hợp khi lịch trong ngày quá dày')+'<div class="card"><div class="toolbar"><input placeholder="Tìm theo tên khách, dịch vụ, giờ..." value="'+safe(search)+'" oninput="search=this.value;render()" style="flex:1;padding:12px;border:1px solid #dce4dc;border-radius:10px"><button class="secondary" onclick="nav(\'calendar\')">▦ Calendar</button></div><div class="stack margin">'+bs.map(b=>'<div><small class="muted">'+b.date+'</small>'+bookingCard(b)+'</div>').join('')+'</div></div>'}
function customersPage(){let cs=db.customers.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(search.toLowerCase()));return header('Khách hàng','Hồ sơ, lịch hẹn, quyền lợi và lịch sử giao dịch',true)+'<div class="card"><div class="toolbar"><input placeholder="Tìm tên hoặc số điện thoại..." value="'+safe(search)+'" oninput="search=this.value;render()" style="flex:1;padding:12px;border:1px solid #dce4dc;border-radius:10px"><button class="secondary" onclick="modal=\'customerNew\';render()">＋ Thêm khách</button></div><div class="stack margin">'+cs.map(c=>'<div class="item"><div class="symbol" style="width:38px;height:38px;font-family:Inter;font-size:14px">'+c.name.split(' ').slice(-1)[0][0]+'</div><div class="grow"><strong>'+safe(c.name)+'</strong><small>'+safe(c.phone)+' · '+c.visits+' lần đến</small></div><button class="secondary" onclick="modal=\'customer\';form={id:\''+c.id+'\'};render()">Hồ sơ →</button></div>').join('')+'</div></div>'}
function servicesPage(){return header('Dịch vụ & liệu trình','Dữ liệu mẫu phục vụ kiểm thử booking',false)+'<div class="grid three">'+db.services.map(s=>'<div class="card"><div class="badge">Dịch vụ</div><h2 style="margin:18px 0 7px">'+s.name+'</h2><p>'+s.mins+' phút</p><div class="separator"></div><div class="row"><strong>'+money(s.price)+'</strong><button class="secondary" onclick="startBooking();form.serviceId=\''+s.id+'\';render()">Đặt lịch</button></div></div>').join('')+'</div><div class="card section"><h2>Gói liệu trình đã bán</h2>'+db.packages.map(p=>'<div class="row"><div><strong>'+customer(p.customerId).name+'</strong><p>'+service(p.serviceId).name+' · '+p.remaining+'/'+p.total+' buổi còn lại</p></div><span class="badge">Đến '+p.expiry+'</span></div>').join('')+'</div>'}
function staffPage(){return header('Nhân viên & nguồn lực','Năng lực phục vụ và điều phối nhân sự',false)+'<div class="grid four">'+db.staff.map(s=>'<div class="card"><div class="symbol">✳</div><h2 class="margin">'+s.name+'</h2><p>'+s.role+'</p><div class="separator"></div><span class="badge">'+db.bookings.filter(b=>b.date===today&&b.staffId===s.id).length+' lịch hôm nay</span></div>').join('')+'</div><div class="card section"><h2>Phòng & giường</h2><div class="pillrow">'+['P.01','P.02','P.03','P.04'].map(x=>'<span class="chip">'+x+'</span>').join('')+'</div><div class="help margin">Prototype đang kiểm tra xung đột KTV. Kiểm tra phòng/giường và ca làm là phần cần mở rộng trước khi triển khai thực tế.</div></div>'}
function transactionsPage(){let sum=db.payments.reduce((a,p)=>a+p.amount,0);return header('Giao dịch','Theo dõi các lần checkout trong phiên demo',false)+'<div class="grid three"><div class="card stat"><small>Tổng thu trong demo</small><b>'+money(sum)+'</b></div><div class="card stat"><small>Số giao dịch</small><b>'+db.payments.length+'</b></div><div class="card stat"><small>Buổi liệu trình sử dụng</small><b>'+db.ledger.length+'</b></div></div><div class="card section"><h2>Lịch sử thanh toán</h2>'+(db.payments.length?'<table class="table"><tr><th>Khách hàng</th><th>Loại giao dịch</th><th>Số tiền</th></tr>'+db.payments.map(p=>'<tr><td>'+customer(p.customerId).name+'</td><td>'+(p.packageUsed?'Dùng liệu trình + ':'')+(p.serum?'Serum':'Dịch vụ')+'</td><td>'+money(p.amount)+'</td></tr>').join('')+'</table>':'<div class="empty">Chưa có giao dịch. Hoàn tất dịch vụ và mở checkout để thử.</div>')+'</div>'}
function reportsPage(){let byStaff=db.staff.map(s=>({name:s.name,count:db.bookings.filter(b=>b.staffId===s.id&&b.date===today).length}));return header('Báo cáo vận hành','Chỉ số minh họa, chưa phải dữ liệu kinh doanh thật',false)+'<div class="grid three"><div class="card stat"><small>Tổng lịch demo</small><b>'+db.bookings.length+'</b></div><div class="card stat"><small>Hoàn tất</small><b>'+db.bookings.filter(b=>b.status==='completed').length+'</b></div><div class="card stat"><small>Đã thu</small><b>'+money(db.payments.reduce((a,p)=>a+p.amount,0))+'</b></div></div><div class="card section"><h2>Lịch theo kỹ thuật viên hôm nay</h2>'+byStaff.map(s=>'<div class="margin"><div class="row"><strong>'+s.name+'</strong><span>'+s.count+' lịch</span></div><div class="progress"><div style="width:'+Math.min(100,s.count/7*100)+'%"></div></div></div>').join('')+'</div>'}
function select(k,options,val){return '<select onchange="setForm(\''+k+'\',this.value)">'+options.map(([id,name])=>'<option value="'+id+'" '+(id===val?'selected':'')+'>'+safe(name)+'</option>').join('')+'</select>'}
function field(name,content){return '<div class="field"><label>'+name+'</label>'+content+'</div>'}
function modalLayout(title,sub,body){return '<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="drawer"><header><div><div class="eyebrow">SERENE SPA</div><h2>'+title+'</h2><p>'+sub+'</p></div><button class="secondary" onclick="closeModal()">✕</button></header>'+body+'</div></div>'}
function newBookingModal(){let c=customer(form.customerId),s=service(form.serviceId),conf=conflict(form.date,form.time,form.staffId,form.serviceId,form.id);let fields=field('Khách hàng',select('customerId',db.customers.map(c=>[c.id,c.name+' · '+c.phone]),form.customerId))+field('Dịch vụ',select('serviceId',db.services.map(s=>[s.id,s.name+' · '+s.mins+' phút · '+money(s.price)]),form.serviceId))+field('KTV',select('staffId',db.staff.map(s=>[s.id,s.name+' · '+s.role]),form.staffId))+'<div class="columns">'+field('Ngày','<input type="date" value="'+form.date+'" onchange="setForm(\'date\',this.value)">')+field('Giờ bắt đầu','<input type="time" value="'+form.time+'" onchange="setForm(\'time\',this.value)">')+'</div>'+field('Phòng',select('room',['P.01','P.02','P.03','P.04'].map(x=>[x,x]),form.room))+field('Ghi chú','<textarea rows="2" oninput="setForm(\'note\',this.value)">'+safe(form.note)+'</textarea>');let review='<div class="overlay"><h3>Xem trước lịch hẹn</h3><p>'+safe(c?.name)+' · '+safe(s?.name)+'</p><div class="margin">'+form.date+' lúc '+form.time+' · KTV '+staff(form.staffId)?.name+'</div><div class="separator"></div><strong>Thời lượng '+s?.mins+' phút</strong><p class="margin">Tiền dịch vụ: '+money(s?.price)+'</p></div>'+(conf?'<div class="help margin" style="background:#fff0e7;color:#ab5e43">⚠ KTV có lịch trùng trong thời gian này. Quay lại chọn giờ khác.</div>':'<div class="help margin">✓ KTV chưa có lịch trùng trong khung giờ đã chọn.</div>');return modalLayout(form.id?'Đổi lịch hẹn':'Tạo lịch hẹn','Chọn thông tin → Kiểm tra → Xác nhận','<div class="steps"><span class="on"></span><span class="'+(step===1?'on':'')+'"></span></div>'+(step===0?fields:review)+'<div class="row margin">'+(step===1?'<button class="secondary" onclick="step=0;render()">← Quay lại</button>':'<button class="secondary" onclick="closeModal()">Hủy</button>')+'<button class="primary" onclick="'+(step===0?'step=1;render()':'saveBooking()')+'">'+(step===0?'Tiếp tục →':'Xác nhận lịch')+'</button></div>')}
function bookingModal(){let b=db.bookings.find(b=>b.id===form.id);if(!b)return '';let c=customer(b.customerId),s=service(b.serviceId),pkg=getPackage(b),paid=db.payments.find(p=>p.bookingId===b.id),isFinished=b.status==='completed',isClosed=['cancelled','no_show'].includes(b.status);let actions='';if(b.status==='pending')actions+='<button class="primary" onclick="changeStatus(\''+b.id+'\',\'confirmed\')">Xác nhận lịch</button>';if(b.status==='confirmed')actions+='<button class="primary" onclick="changeStatus(\''+b.id+'\',\'checked_in\')">✓ Check-in</button>';if(b.status==='checked_in')actions+='<button class="primary" onclick="changeStatus(\''+b.id+'\',\'started\')">▶ Bắt đầu phục vụ</button>';if(b.status==='started')actions+='<button class="primary" onclick="changeStatus(\''+b.id+'\',\'completed\')">✓ Hoàn tất dịch vụ</button>';if(isFinished&&!b.paid)actions+='<button class="primary" onclick="modal=\'checkout\';render()">Thanh toán →</button>';if(b.paid)actions+='<button class="primary" onclick="startBooking(\''+b.customerId+'\');form.serviceId=\''+b.serviceId+'\';render()">＋ Đặt buổi tiếp</button>';if(!isClosed&&!isFinished)actions+='<button class="secondary" onclick="form={id:\''+b.id+'\',customerId:\''+b.customerId+'\',serviceId:\''+b.serviceId+'\',staffId:\''+b.staffId+'\',date:\''+b.date+'\',time:\''+b.time+'\',room:\''+b.room+'\',note:'+JSON.stringify(b.note||'')+'};step=0;modal=\'new\';render()">Đổi giờ / KTV</button>';let footer=!isClosed&&!isFinished?'<div class="separator"></div><div class="row"><button class="link" style="color:#ba645c" onclick="if(confirm(\'Hủy lịch hẹn này?\'))changeStatus(\''+b.id+'\',\'cancelled\')">Hủy lịch</button><button class="link" onclick="if(confirm(\'Đánh dấu khách không đến?\'))changeStatus(\''+b.id+'\',\'no_show\')">Không đến</button></div>':'';return modalLayout('Chi tiết lịch hẹn',b.date+' · '+b.time,'<div class="row"><h2 style="margin:0">'+safe(c?.name)+'</h2>'+badge(b.status)+'</div><p class="margin">☎ '+safe(c?.phone)+'</p><div class="separator"></div><div class="card"><h3>'+safe(s?.name)+'</h3><p>'+s?.mins+' phút · '+money(s?.price)+'</p><div class="row margin"><span class="badge">KTV '+staff(b.staffId)?.name+'</span><span class="badge">'+b.room+'</span></div></div>'+(pkg?'<div class="help margin">🌿 Khách có liệu trình '+pkg.remaining+'/'+pkg.total+' buổi còn lại. Quyền lợi chỉ khấu trừ khi checkout xác nhận sử dụng.</div>':'')+(b.note?'<p class="margin">Ghi chú: '+safe(b.note)+'</p>':'')+(paid?'<div class="help margin">✓ Đã thanh toán '+money(paid.amount)+(paid.packageUsed?' · Đã sử dụng 1 buổi liệu trình':'')+'</div>':'')+'<div class="stack margin">'+actions+'</div>'+footer)}
function checkoutModal(){let b=db.bookings.find(x=>x.id===form.id);let pkg=getPackage(b);let isPkg=form.usePkg===undefined?!!pkg:form.usePkg&&!!pkg;let amount=(isPkg?0:service(b.serviceId).price)+(extraSale?450000:0);return modalLayout('Checkout','Khách hàng: '+customer(b.customerId).name,'<div class="card"><h3>'+service(b.serviceId).name+'</h3><p>Giá dịch vụ: '+money(service(b.serviceId).price)+'</p>'+(pkg?'<div class="margin help">Có gói liệu trình: '+pkg.remaining+' buổi còn lại</div><label class="item margin"><input type="checkbox" '+(isPkg?'checked':'')+' onchange="form.usePkg=this.checked;render()"> <span>Sử dụng 1 buổi thuộc liệu trình (0đ)</span></label>':'')+'<label class="item margin"><input type="checkbox" '+(extraSale?'checked':'')+' onchange="extraSale=this.checked?1:0;render()"><span class="grow">Mua thêm serum dưỡng da</span><b>'+money(450000)+'</b></label><div class="separator"></div><div class="row"><h2>Tổng cần thanh toán</h2><h2>'+money(amount)+'</h2></div></div><div class="help margin">Việc checkout chỉ ghi nhận một lần. Nếu dùng gói, 1 buổi được khấu trừ cùng giao dịch, không khấu trừ ở bước check-in.</div><button class="primary margin" style="width:100%" onclick="checkout(\''+b.id+'\','+isPkg+','+!!extraSale+')">Xác nhận thanh toán · '+money(amount)+'</button>')}
function customerModal(){let c=customer(form.id),pkgs=db.packages.filter(p=>p.customerId===c.id),bs=db.bookings.filter(b=>b.customerId===c.id).sort((a,b)=>b.date.localeCompare(a.date));return modalLayout('Hồ sơ khách hàng',c.phone,'<h2>'+safe(c.name)+'</h2><p>Đã đến '+c.visits+' lần · '+safe(c.notes)+'</p><div class="separator"></div><h3>Liệu trình & quyền lợi</h3>'+(pkgs.length?pkgs.map(p=>'<div class="card margin"><strong>'+service(p.serviceId).name+'</strong><div class="row margin"><span>'+p.remaining+'/'+p.total+' buổi còn lại</span><span>HSD '+p.expiry+'</span></div><div class="progress"><div style="width:'+(p.remaining/p.total*100)+'%"></div></div></div>').join(''):'<p>Chưa có liệu trình</p>')+'<h3 class="margin">Lịch sử & lịch sắp tới</h3><div class="stack">'+bs.map(b=>bookingCard(b,true)).join('')+'</div><button class="primary margin" onclick="startBooking(\''+c.id+'\')">＋ Đặt lịch cho khách</button>')}
function customerNewModal(){return modalLayout('Thêm khách hàng','Tạo nhanh hồ sơ để đặt lịch',field('Họ và tên','<input id="newname" placeholder="Nguyễn Văn A">')+field('Số điện thoại','<input id="newphone" placeholder="09xxxxxxxx">')+'<button class="primary" onclick="addCustomer()">Lưu khách hàng</button>')}
function addCustomer(){let name=document.getElementById('newname').value.trim(),phone=document.getElementById('newphone').value.trim();if(!name||!phone){notify('Vui lòng nhập tên và số điện thoại');return}if(db.customers.some(c=>c.phone===phone)){notify('Số điện thoại này đã tồn tại');return}let id='c'+Date.now();db.customers.push({id,name,phone,visits:0,notes:''});persist();startBooking(id)}
const navs=[['today','⌂','Hôm nay'],['calendar','▦','Lịch hẹn'],['appointments','≡','Danh sách lịch'],['customers','♙','Khách hàng'],['services','✿','Dịch vụ & liệu trình'],['staff','♧','Nhân sự & phòng'],['transactions','▤','Giao dịch'],['reports','▥','Báo cáo']];
function render(){let page={today:todayPage,calendar:calendarPage,appointments:appointmentsPage,customers:customersPage,services:servicesPage,staff:staffPage,transactions:transactionsPage,reports:reportsPage}[view]||todayPage;el.innerHTML='<aside class="sidebar"><div class="logo"><div class="symbol">✳</div><div class="brandtext">serene<div class="sublabel">SPA BOOKING</div></div></div><nav class="nav">'+navs.map(([id,ico,name])=>'<button class="'+(view===id?'active':'')+'" onclick="nav(\''+id+'\')"><span class="ico">'+ico+'</span><span class="navlabel">'+name+'</span></button>').join('')+'</nav><div class="foot">Prototype · Demo data<br><button class="link" onclick="if(confirm(\'Đặt lại toàn bộ dữ liệu demo?\')){db=structuredClone(initial);persist();nav(\'today\');}">↻ Đặt lại dữ liệu</button><br>Haravan-inspired accent · Independent Spa UI</div></aside><main class="main">'+page()+'</main>'+(modal==='new'?newBookingModal():modal==='booking'?bookingModal():modal==='checkout'?checkoutModal():modal==='customer'?customerModal():modal==='customerNew'?customerNewModal():'')+(toastText?'<div class="toast">'+safe(toastText)+'</div>':'')}
render();
</script></body></html>
